name: Sync with Upstream

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/moggieuk/fluidd-happy-hare-edition
          git fetch upstream

      - name: Sync with upstream
        run: |
          git checkout develop # Replace with your branch
          git merge upstream/develop --allow-unrelated-histories
        continue-on-error: true  # Ignore errors (such as merge conflicts) during the merge process

      - name: Push changes
        run: |
          git push origin develop
        if: success()  # Only push if the merge was successful (no conflicts)
